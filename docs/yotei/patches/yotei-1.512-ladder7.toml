# Ghost of Yotei PPSA26344 01.512.000 (app0/eboot.bin md5 41c6624c2b515c6608c49fa55ae3d418): quality ladder row 7.
# Port of DarthPotato's 02.002.000 ladder patch (https://github.com/DarthPotato/yotei-patches, CC0; technique and the
# 01.512 row address from its FINDINGS.md) to 01.512.000, 2026-11-27. The game keeps one int, the row of its own
# scalability ladder (22 rows at va 0x1F9BFC0 of {int, LOD scale, sun shadow view delta, small shadow caster cull, int};
# row 0 = full quality). The row int is at va 0x4FE5B70 and the game rewrites it at runtime, so every instruction that
# reads it is patched: 01.512 has 16 of them (02.002 has 17), all movsxd r64, [rip+row] (7 bytes), each becoming
# mov r32, 7; nop. Row 7: LOD scale 0.5, one fewer sun shadow view. Rows 16-21 also stop drawing the player's body.
# target = the unwrapped eboot (relinker input, md5 5ff37e34172020d48cba45847808d35c); va = ELF virtual address
# (file offset - 0x4000).
# Use: relinker --windows --to-intel --patches <this file> eboot.elf <out>/eboot.exe (check first with --verify-patches).
format = 1

[[patch]]
name     = "ladder_row7_be1d5b"
description = "movsxd rax, [rip+ladder_row] -> mov eax, 7; nop"
target   = "eboot.elf"
va       = 0xbe1d5b
expected = "4863050e3e4004"
value    = "b8070000006690"

