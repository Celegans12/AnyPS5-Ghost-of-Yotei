name: Repository maintenance

on:
  issues:
    types: [opened, reopened, edited]
  issue_comment:
    types: [created, edited]
  pull_request_target:
    branches: [AnyKyty, Brainrot]
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  schedule:
    - cron: '13,43 * * * *'
  workflow_run:
    workflows: [AnyKyty, Offline checks, Brainrot]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Review a specific pull request by number
        required: false
        type: string
  push:
    branches: [test/hosted-maintenance]

permissions: {}

concurrency:
  group: repository-maintenance-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull_request || github.event_name }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'simnJS/AnyPS5' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -I tools/repository_maintenance.py verify

  review:
    if: >-
      github.repository == 'simnJS/AnyPS5' &&
      github.ref == 'refs/heads/AnyKyty' &&
      github.event.sender.type != 'Bot' &&
      github.event_name != 'workflow_run' &&
      (github.event_name != 'pull_request_target' || github.event.action != 'labeled')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: repository-maintenance
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PUBLIC_SCAN_WORDS: ${{ secrets.PUBLIC_SCAN_WORDS }}
        run: python3 -I tools/repository_maintenance.py review

  merge:
    concurrency:
      group: repository-maintenance-merge
      cancel-in-progress: false
    if: >-
      github.repository == 'simnJS/AnyPS5' &&
      github.ref == 'refs/heads/AnyKyty' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'pull_request' ||
         (github.event.workflow_run.event == 'push' && github.event.workflow_run.name == 'Brainrot' &&
          startsWith(github.event.workflow_run.head_branch, 'test/brainrot-integrate-')))) ||
       (github.event_name == 'workflow_dispatch' && !inputs.pull_request) ||
       (github.event_name == 'pull_request_target' && github.event.label.name == 'automerge'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: repository-maintenance
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ secrets.MAINTAINER_MERGE_TOKEN }}
          PUBLIC_SCAN_WORDS: ${{ secrets.PUBLIC_SCAN_WORDS }}
        run: python3 -I tools/repository_maintenance.py merge
